<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000B4D">
<title>Sedia d'Oro</title>
<meta name="description" content="Il voto di fine giornata sul set: passa il telefono, vota, poi la premiazione sulla sedia da regista.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --blu:#0020B1; --blu-scuro:#000B4D;
    --fumo:rgba(255,255,255,.07); --fumo-2:rgba(255,255,255,.13); --linea:rgba(255,255,255,.22);
    --oro:#E8B84A; --oro-chiaro:#F6DD8E;
    --rosa:#ED8EA9;
    --carta:#FFFFFF; --carta-2:rgba(255,255,255,.78); --carta-3:rgba(255,255,255,.55);
    --ink:#1A1A1A; --r:16px; --acc:var(--oro);
    --font:"Montserrat","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  ::selection{background:var(--rosa);color:var(--ink)}
  body{margin:0;background:var(--blu-scuro);background-image:linear-gradient(170deg,#000A45 0%,#001178 38%,var(--blu) 70%,#00168C 100%);background-attachment:fixed;
       color:var(--carta);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100svh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.75) 1.2px,transparent 1.7px);background-size:140px 170px;opacity:.35}
  .glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 45% at 50% -10%,var(--acc),transparent 65%);opacity:.22;transition:background .5s}
  .app{max-width:480px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:18px 20px 32px;position:relative}
  .screen{display:none;flex:1;flex-direction:column;gap:20px}
  .screen.on{display:flex}
  @media (prefers-reduced-motion:no-preference){
    .screen.on{animation:in .28s ease-out}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{height:36px;width:auto;display:block}
  .brand small{display:block;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--carta-3);max-width:150px;line-height:1.3}
  .tools{display:flex;align-items:center;gap:8px}
  .lang{display:flex;border:1px solid var(--linea);border-radius:999px;overflow:hidden}
  .lang button{appearance:none;border:0;background:transparent;color:var(--carta-3);font:inherit;font-size:11px;font-weight:800;letter-spacing:.08em;padding:6px 9px;cursor:pointer}
  .lang button.on{background:var(--carta);color:var(--blu)}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--rosa)}
  h1{font-weight:900;font-size:clamp(44px,13vw,64px);line-height:.95;letter-spacing:-.03em;margin:0;text-transform:uppercase;text-wrap:balance}
  h1 em{font-style:normal;color:var(--oro);display:block}
  h2{font-weight:800;font-size:clamp(28px,8vw,38px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
  h2 .rosa{color:var(--rosa)}
  h2.acc{color:var(--acc)}
  p{margin:0}
  .muted{color:var(--carta-2)}
  .small{font-size:14px}
  .link{background:none;border:0;color:var(--carta-2);font:inherit;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
  .btn{appearance:none;border:0;font:inherit;cursor:pointer;padding:16px 22px;font-weight:800;font-size:16px;border-radius:12px;
       background:var(--rosa);color:var(--ink);width:100%;text-align:center;letter-spacing:.02em;display:flex;justify-content:center;align-items:center;gap:8px}
  .btn svg{width:20px;height:20px}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{background:var(--fumo-2);color:var(--carta-3);cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--carta);border:1px solid var(--linea);font-weight:700}
  .btn.bianco{background:var(--carta);color:var(--blu)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn:focus-visible,.chip:focus-visible,.av:focus-visible,input:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px;align-items:center}
  .foot .btn{width:100%}

  .hero{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .sedia-wrap{align-self:center;width:190px;margin:4px 0 -6px}
  .sedia{width:100%;height:auto;display:block;overflow:visible;transform-origin:50% 100%}
  .sedia .luce,.sedia .faro,.sedia .iniz{opacity:0;transition:opacity .6s ease}
  .sedia .q{opacity:1;transition:opacity .3s}
  .sedia.up .luce{opacity:.22}
  .sedia.up .faro{opacity:.7}
  .sedia.up .iniz{opacity:1;transition-delay:.35s}
  .sedia.up .q{opacity:0}
  .sedia.mostra .iniz{opacity:1}
  .sedia.mostra .q{opacity:0}
  .sedia.idle{animation:dondola 5s ease-in-out infinite}
  @keyframes dondola{50%{transform:rotate(1.5deg)}}
  @media (prefers-reduced-motion:reduce){.sedia{animation:none!important}.sedia *{transition:none!important}}
  .urna{display:flex;gap:16px;align-items:center;padding:14px 18px;border:1px solid var(--linea);background:var(--fumo);border-radius:var(--r)}
  .urna b{font-size:40px;font-weight:900;line-height:1;color:var(--oro-chiaro);font-variant-numeric:tabular-nums}
  .urna span{color:var(--carta-2);font-size:13px;line-height:1.35}
  .strip{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:4px 20px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .tile{flex:0 0 132px;scroll-snap-align:start;border-radius:var(--r);padding:14px 12px 12px;background:var(--fumo);border:1px solid var(--linea);display:flex;flex-direction:column;gap:10px;min-height:150px;color:var(--carta);text-align:left}
  .tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tc);color:var(--ink)}
  .tile .ic svg{width:26px;height:26px}
  .tile b{font-weight:800;font-size:14px;line-height:1.2;letter-spacing:-.01em}
  .tile i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--carta-3);margin-top:auto}
  .tile.speciale{border-color:var(--tc)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
  .av{appearance:none;border:0;background:transparent;font:inherit;color:var(--carta);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;padding:0}
  .av .cerchio{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;letter-spacing:-.02em;color:var(--ink);background:var(--tc);position:relative;border:3px solid transparent}
  .av b{font-weight:700;font-size:12px;line-height:1.2;text-align:center}
  .av small{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--carta-3);text-align:center}
  .av.done .cerchio{background:var(--fumo-2);color:var(--carta-3);border-color:var(--linea)}
  .av.done .cerchio::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#7CC98A;color:var(--ink);font-size:14px;display:grid;place-items:center}
  .av.done b{color:var(--carta-3)}
  .av.done{cursor:default}

  .cat-head{display:flex;gap:14px;align-items:center}
  .cat-ic{flex:0 0 72px;width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--acc);color:var(--ink);box-shadow:0 12px 30px -10px var(--acc)}
  .cat-ic svg{width:42px;height:42px}
  .progress{display:flex;gap:4px}
  .progress i{flex:1;height:3px;background:var(--fumo-2);border-radius:2px}
  .progress i.on{background:var(--acc)}
  .progress i.now{background:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{appearance:none;font:inherit;cursor:pointer;border:1px solid var(--linea);background:var(--fumo);color:var(--carta);
        padding:10px 14px;font-size:15px;font-weight:600;line-height:1.2;text-align:left;border-radius:999px;display:flex;flex-direction:column;gap:1px}
  .chip small{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--carta-3)}
  .chip.sel{background:var(--acc);border-color:var(--acc);color:var(--ink)}
  .chip.sel small{color:rgba(0,0,0,.55)}
  .chip.me{border-style:dashed;opacity:.45;cursor:default}
  input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:14px;background:var(--fumo);color:var(--carta);border:1px solid var(--linea);border-radius:12px}
  textarea{min-height:90px;resize:vertical}
  .q{display:flex;flex-direction:column;gap:8px}
  .q b{font-weight:700;font-size:15px}
  .quote-in{border-left:3px solid var(--acc);padding-left:12px}

  .rate{display:flex;gap:6px}
  .rate button{flex:1;aspect-ratio:1;appearance:none;border:1px solid var(--linea);background:var(--fumo);cursor:pointer;padding:7px;border-radius:12px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .rate button svg *{pointer-events:none}
  .rate button svg{width:100%;height:100%;display:block}
  .rate button.on{background:var(--oro);border-color:var(--oro)}
  .rate button.on svg *{stroke:var(--ink)}
  .scala{display:flex;justify-content:space-between;font-size:11px;color:var(--carta-3);font-weight:600}

  /* foto */
  .foto-add{display:flex;flex-direction:column;gap:10px}
  .foto-prev{display:none;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--linea)}
  .foto-prev.on{display:block}
  .foto-prev img{display:block;width:100%;max-height:260px;object-fit:cover}
  .foto-prev button{position:absolute;top:8px;right:8px;appearance:none;border:0;background:rgba(0,0,0,.6);color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ph{position:relative;border-radius:12px;overflow:hidden;background:var(--fumo);border:1px solid var(--linea)}
  .ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
  .ph .cap{padding:8px 10px;font-size:12px;line-height:1.3}
  .ph .cap b{display:block;font-weight:700}
  .ph .cap span{color:var(--carta-3)}
  .ph .tag{position:absolute;top:8px;left:8px;background:var(--oro);color:var(--ink);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:999px}
  .ph .del{position:absolute;top:6px;right:6px;appearance:none;border:0;background:rgba(0,0,0,.55);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px}
  .thumbs{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
  .thumbs::-webkit-scrollbar{display:none}
  .thumbs img{flex:0 0 84px;width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--linea)}
  .empty{padding:20px;border:1px dashed var(--linea);border-radius:12px;color:var(--carta-3);text-align:center;font-size:14px}

  .award{border-radius:var(--r);padding:0;margin-bottom:12px;background:var(--fumo);border:1px solid var(--linea);overflow:hidden;cursor:pointer}
  .award .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--tc);color:var(--ink)}
  .award .bar svg{width:22px;height:22px;flex:0 0 22px}
  .award .bar b{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .award .body{padding:14px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .award .sedia-wrap{width:150px;margin:0}
  .award .nome{font-weight:900;font-size:28px;line-height:1;letter-spacing:-.02em;text-transform:uppercase;color:var(--tc);min-height:28px}
  .award .ruolo{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--carta-3)}
  .award .voti{font-size:13px;color:var(--carta-2)}
  .award .tap{font-size:12px;font-weight:800;color:var(--tc);letter-spacing:.1em;text-transform:uppercase}
  .award.rev .tap{display:none}
  .award blockquote{margin:4px 0 0;font-style:italic;color:var(--carta-2);font-size:14px}
  .pagella .riga{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linea)}
  .pagella .riga b{font-weight:600;font-size:15px}
  .pagella .riga span{font-weight:900;font-size:28px;color:var(--oro);font-variant-numeric:tabular-nums}
  .pagella .riga span small{font-weight:400;font-size:12px;color:var(--carta-3);margin-left:6px}
  .commenti ul{margin:0;padding:0;display:grid;gap:8px}
  .commenti li{list-style:none;padding:10px 12px;background:var(--fumo);border-left:3px solid var(--rosa);border-radius:0 10px 10px 0;font-size:15px}
  pre.export{white-space:pre-wrap;font:14px/1.5 var(--font);background:var(--fumo);border:1px solid var(--linea);border-radius:12px;padding:14px;margin:0;user-select:all}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--rosa);color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
</style>

<div class="glow"></div>
<div class="app">

const DB = { name:"sedia-doro", store:"foto" };
function dbOpen(){ return new Promise((ok,ko)=>{ const r=indexedDB.open(DB.name,1); r.onupgradeneeded=()=>{ const s=r.result.createObjectStore(DB.store,{keyPath:"id"}); s.createIndex("ed","ed"); }; r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function fotoAdd(rec){ const d=await dbOpen(); return new Promise((ok,ko)=>{ const tx=d.transaction(DB.store,"readwrite"); tx.objectStore(DB.store).put(rec); tx.oncomplete=ok; tx.onerror=()=>ko(tx.error); }); }
async function fotoAll(){ try{ const d=await dbOpen(); return new Promise((ok,ko)=>{ const r=d.transaction(DB.store).objectStore(DB.store).index("ed").getAll(EDIZIONE.id); r.onsuccess=()=>ok(r.result.sort((a,b)=>a.t<b.t?-1:1)); r.onerror=()=>ko(r.error); }); }catch(e){ return []; } }
async function fotoDel(id){ const d=await dbOpen(); return new Promise((ok,ko)=>{ const tx=d.transaction(DB.store,"readwrite"); tx.objectStore(DB.store).delete(id); tx.oncomplete=ok; tx.onerror=()=>ko(tx.error); }); }
async function fotoClear(){ const all=await fotoAll(); for(const f of all) await fotoDel(f.id); }
function ridimensiona(file, max=1600){ return new Promise((ok,ko)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?ok(b):ko(new Error("blob")),"image/jpeg",.84); }; img.onerror=ko; img.src=u; }); }
const urlCache = new Map();
function fotoURL(f){ if(!urlCache.has(f.id)) urlCache.set(f.id, URL.createObjectURL(f.blob)); return urlCache.get(f.id); }
async function salvaFoto(file, kind, voter, cap){ const blob=await ridimensiona(file); const rec={id:Date.now()+"-"+Math.random().toString(36).slice(2,7), ed:EDIZIONE.id, kind, voter, cap:cap||"", t:new Date().toISOString(), blob}; await fotoAdd(rec); return rec; }

/* ---- premiazione ---- */
function conta(getter){
  const m=new Map(); VOTI.forEach(v=>{ const k=getter(v); if(!k) return; m.set(k,(m.get(k)||0)+1); });
  const arr=[...m.entries()].sort((a,b)=>b[1]-a[1]); if(!arr.length) return {vincitori:[],n:0};
  const top=arr[0][1]; return {vincitori:arr.filter(x=>x[1]===top).map(x=>x[0]), n:top};
}
function media(key){ const xs=VOTI.map(v=>v.ratings[key]).filter(Boolean); return xs.length?{m:xs.reduce((a,b)=>a+b,0)/xs.length,n:xs.length}:null; }
const norm = s => (s||"").toLowerCase().replace(/[.!?…]+$/,"").trim();
const fmt = x => x.m.toFixed(1).replace(".", LANG==="en"?".":",");
function risultati(){
  const righe=[`🪑 SEDIA D'ORO · ${EDIZIONE.titolo}`, EDIZIONE.luogo, `${VOTI.length} ${t("jurors")}`, ""];
  const cards=[];
  PREMI.forEach(p=>{
    const c = p.type==="person" ? conta(v=>v.picks[p.id]) : conta(v=>norm(v.texts[p.id]));
    let nomi, sub="";
    if(!c.vincitori.length) nomi=t("none");
    else if(p.type==="person"){ nomi=c.vincitori.join(" & "); sub=c.vincitori.length===1?persona(c.vincitori[0])[1]:t("tie"); }
    else { const orig=VOTI.map(v=>v.texts[p.id]).find(x=>norm(x)===c.vincitori[0]); nomi="“"+(orig||c.vincitori[0])+"”"; sub=c.vincitori.length>1?t("tie_text")(c.vincitori.length-1):""; }
    const quote = p[LANG].extra ? VOTI.filter(v=>c.vincitori.includes(v.picks[p.id]) && v.texts[p.id]).map(v=>v.texts[p.id]) : [];
    cards.push({p,c,nomi,sub,quote});
    righe.push(`${pn(p,"n")}: ${nomi}${c.n?` (${c.n})`:""}`);
  });
  const mp=media("pranzo"), mo=media("org");
  righe.push("", `${t("lunch")} ${mp?fmt(mp):"–"}/5 · ${t("day")} ${mo?fmt(mo):"–"}/5`);
  return {cards, mp, mo, testo:righe.join("\n")};
}
async function renderAwards(){
  VOTI = load();
  $("#awards-count").textContent = t("count")(VOTI.length);
  const R=risultati();
  const A=$("#awards"); A.innerHTML="";
  R.cards.forEach(({p,c,nomi,sub,quote})=>{
    const card=el("div","award"); card.style.setProperty("--tc",p.col);
    const iniz = !c.vincitori.length ? "–" : (p.type==="text" ? "«»" : (c.vincitori.length>1 ? "&" : iniziali(c.vincitori[0])));
    card.innerHTML=`<div class="bar">${ICONS[p.icon]}<b>${esc(pn(p,"n"))}</b></div><div class="body"><div class="sedia-wrap">${sediaSVG(iniz)}</div>
      <p class="tap">${t("tap")}</p><div class="nome" hidden>${esc(nomi)}</div><div class="ruolo" hidden>${esc(sub)}</div>
      <div class="voti" hidden>${c.n?t("votes")(c.n,VOTI.length):""}</div>${quote.length?`<blockquote hidden>${quote.map(q=>"«"+esc(q)+"»").join(" · ")}</blockquote>`:""}</div>`;
    card.addEventListener("click",()=>{ card.classList.add("rev"); card.querySelector(".sedia").classList.add("up"); card.querySelectorAll("[hidden]").forEach(x=>x.hidden=false); },{once:true});
    A.append(card);
  });
  const P=$("#pagella"); P.innerHTML="";
  const riga=(lbl,x)=>el("div","riga",`<b>${lbl}</b><span>${x?fmt(x):"–"}<small>${x?t("of5")+x.n+" "+t("votes_w"):t("novotes")}</small></span>`);
  P.append(riga(t("lunch"),R.mp), riga(t("day"),R.mo));
  const C=$("#commenti"); C.innerHTML="";
  const note=VOTI.filter(v=>v.nota).map(v=>v.nota);
  if(note.length){ C.append(el("p","eyebrow",t("comments_label"))); const ul=el("ul"); note.forEach(n=>ul.append(el("li",null,esc(n)))); C.append(ul); }
  $("#export").textContent = R.testo;
  const th=$("#cer-thumbs"); th.innerHTML="";
  (await fotoAll()).filter(f=>f.kind==="cer").forEach(f=>{ const i=el("img"); i.src=fotoURL(f); i.alt=f.cap; th.append(i); });
}
$("#cer-btn").addEventListener("click",()=>$("#cer-file").click());
$("#cer-file").addEventListener("change",async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return; try{ await salvaFoto(f,"cer","",""); renderAwards(); }catch(err){ toast("!"); } });
$("#copy").addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText($("#export").textContent); toast(t("copied")); }catch(e){ toast(t("copy_fail")); } });

/* ---- archivio ---- */
async function renderArchivio(){
  const G=$("#gallery"); G.innerHTML="";
  const foto=await fotoAll();
  if(!foto.length){ G.append(el("div","empty",t("empty"))); G.style.display="block"; }
  else { G.style.display="grid"; foto.forEach(f=>{ const d=el("div","ph",`<img src="${fotoURL(f)}" alt="${esc(f.cap)}"><span class="tag">${f.kind==="cer"?t("tag_cer"):t("tag_set")}</span><button class="del" aria-label="delete">×</button><div class="cap"><b>${esc(f.cap||"")}</b><span>${esc(f.voter||"")}</span></div>`);
    d.querySelector(".del").addEventListener("click",async()=>{ if(confirm(t("del_confirm"))){ await fotoDel(f.id); renderArchivio(); } }); G.append(d); }); }
}
$("#zip").addEventListener("click",async()=>{
  if(typeof JSZip==="undefined"){ toast(t("zip_fail")); return; }
  VOTI=load(); const R=risultati(); const foto=await fotoAll();
  const z=new JSZip(); const root=z.folder("Sedia-d-Oro_"+EDIZIONE.id);
  root.file("risultati.txt", R.testo);
  root.file("voti.json", JSON.stringify(VOTI,null,2));
  const pad=n=>String(n).padStart(2,"0"); const nomi=[];
  foto.forEach((f,i)=>{ const nome=`foto/${pad(i+1)}_${f.kind}_${(f.voter||"").replace(/[^\w]+/g,"-")||"x"}.jpg`; root.file(nome,f.blob); nomi.push({nome,f}); });
  const html=`<!doctype html><meta charset="utf-8"><title>Sedia d'Oro · ${esc(EDIZIONE.titolo)}</title><style>body{font-family:Montserrat,Arial,sans-serif;background:#000B4D;color:#fff;margin:0;padding:24px;max-width:960px;margin:auto}h1{font-weight:900}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.g img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.g figcaption{font-size:12px;opacity:.75}pre{white-space:pre-wrap;background:rgba(255,255,255,.07);padding:16px;border-radius:12px}</style><h1>Sedia d'Oro</h1><p>${esc(EDIZIONE.titolo)} · ${esc(EDIZIONE.luogo)}</p><pre>${esc(R.testo)}</pre><div class="g">${nomi.map(({nome,f})=>`<figure><img src="${nome}" alt=""><figcaption>${esc(f.cap||"")} ${f.voter?"· "+esc(f.voter):""} · ${f.kind}</figcaption></figure>`).join("")}</div>`;
  root.file("index.html", html);
  const blob=await z.generateAsync({type:"blob"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="Sedia-d-Oro_"+EDIZIONE.id+".zip"; document.body.append(a); a.click(); a.remove();
  toast(t("zip_done"));
});
$("#reset").addEventListener("click",async()=>{ if(confirm(t("reset_confirm"))){ VOTI=[]; save(VOTI); await fotoClear(); go("home"); toast(t("reset_done")); } });
function toast(x){ const n=$("#toast"); n.textContent=x; n.classList.add("on"); setTimeout(()=>n.classList.remove("on"),1800); }

applyT(); renderHome();
</script>
